# Two-way site <-> central sync (prototype): the one place that says what is
# synced and how. Triggers, the wire format, ownership checks and the CI check
# (`rake site_sync:check`) are all generated from this file.
#
# class:            shared_identity -> any site may edit; resolved field by field
#                   clinical        -> only the site that created the row may edit
# priority:             critical batches are always sent before bulk batches
# patient_ref:      column holding the patient's person id ("self" = this row)
# refs:             integer FK -> synced table; sent on the wire as the target's uuid
# protected_fields: never auto-resolved when two sites change them concurrently
schema_version: 1

tables:
  person:
    pk: person_id
    class: shared_identity
    priority: critical
    patient_ref: self
    protected_fields: [gender, birthdate, dead, death_date]

  patient:
    pk: patient_id
    # patient has no uuid column: its id *is* the person id, so it uses the
    # person's uuid.
    uuid_via: person
    class: shared_identity
    priority: critical
    patient_ref: self
    refs: { patient_id: person }

  person_name:
    pk: person_name_id
    class: shared_identity
    priority: critical
    patient_ref: person_id
    refs: { person_id: person }

  patient_identifier:
    pk: patient_identifier_id
    class: shared_identity
    priority: critical
    patient_ref: patient_id
    refs: { patient_id: patient }
    protected_fields: [identifier]

  encounter:
    pk: encounter_id
    class: clinical
    priority: bulk
    patient_ref: patient_id
    refs: { patient_id: patient, provider_id: person, visit_id: visit }

  obs:
    pk: obs_id
    class: clinical
    priority: bulk
    patient_ref: person_id
    refs: { person_id: person, encounter_id: encounter, obs_group_id: obs, order_id: orders }

  visit:
    pk: visit_id
    class: clinical
    priority: bulk
    patient_ref: patient_id
    refs: { patient_id: patient }

  orders:
    pk: order_id
    class: clinical
    priority: bulk
    patient_ref: patient_id
    refs: { patient_id: patient, encounter_id: encounter, obs_id: obs }

  patient_program:
    pk: patient_program_id
    class: clinical
    priority: bulk
    patient_ref: patient_id
    refs: { patient_id: patient }

  person_address:
    pk: person_address_id
    class: clinical
    priority: bulk
    patient_ref: person_id
    refs: { person_id: person }

  person_attribute:
    pk: person_attribute_id
    class: clinical
    priority: bulk
    patient_ref: person_id
    refs: { person_id: person }

  relationship:
    pk: relationship_id
    class: clinical
    priority: bulk
    # Both ends are a person_id; patient_ref has to pick one -- person_a is
    # the relationship's "owner" by OpenMRS convention (e.g. the guardian in
    # a guardian/child relationship), so filtering/subscriptions key off them.
    patient_ref: person_a
    refs: { person_a: person, person_b: person }

# Reference data is not synced by the prototype; every node must hold the same
# rows. Columns pointing at it travel as the referenced row's uuid and are
# matched by uuid on the receiving node, because integer ids differ between
# installations (see db/mahis_pro_to_dev_concept_id_mapping.json).
# REQUIREMENT: central owns the concept dictionary and every site carries the
# same uuids. Installations seeded separately may not (bin/generate_concept_mapping.rb
# had to match them by name); then events are quarantined as
# unknown_reference_data rather than pointing at the wrong concept.
# `match: id` remains available for data known to have identical ids everywhere.
reference_refs:
  creator: { table: users, match: uuid }
  changed_by: { table: users, match: uuid }
  voided_by: { table: users, match: uuid }
  cause_of_death: { table: concept, match: uuid }
  concept_id: { table: concept, match: uuid }
  value_coded: { table: concept, match: uuid }
  value_coded_name_id: { table: concept_name, match: uuid }
  value_drug: { table: drug, match: uuid }
  encounter_type: { table: encounter_type, match: uuid }
  identifier_type: { table: patient_identifier_type, match: uuid }
  location_id: { table: location, match: uuid }
  program_id: { table: program, match: uuid }
  visit_type_id: { table: visit_type, match: uuid }
  indication_concept_id: { table: concept, match: uuid }
  order_type_id: { table: order_type, match: uuid }
  orderer: { table: users, match: uuid }
  discontinued_by: { table: users, match: uuid }
  discontinued_reason: { table: concept, match: uuid }
  person_attribute_type_id: { table: person_attribute_type, match: uuid }
  relationship: { table: relationship_type, match: uuid }

# Columns pointing at tables outside the prototype's scope. Their value is kept
# in central's backup copy of the site (so a restore is exact) but not copied
# to another node, where the id would mean something else. visit_id and
# order_id used to be here too; both moved into encounter's/obs's own refs:
# once visit and orders joined the synced tables above.
unsynced_refs: [form_id, value_group_id]
